    </div>

    <script>
        // Select all artwork images
        const artCards = document.querySelectorAll(".art-card");
const categoryButtons = document.querySelectorAll(".category-btn");
const searchInput = document.getElementById("searchInput");

// Get favorites from localStorage
let favorites = JSON.parse(localStorage.getItem("favorites")) || [];


// -----------------------------
// IMAGE LOADING
// -----------------------------

const images = document.querySelectorAll(".art-card img");

images.forEach((image, index) => {
    image.src = `https://picsum.photos/400/500?random=${index}`;
});


// -----------------------------
// FAVORITES
// -----------------------------

artCards.forEach((card) => {

    const title = card.querySelector("h2").textContent;
    const favoriteButton = card.querySelector(".favorite");

    // Check if already favorite
    if (favorites.includes(title)) {
        favoriteButton.textContent = "♥";
        favoriteButton.classList.add("active");
    }

    favoriteButton.addEventListener("click", () => {

        if (favorites.includes(title)) {

            // Remove from favorites
            favorites = favorites.filter(item => item !== title);

            favoriteButton.textContent = "♡";
            favoriteButton.classList.remove("active");

        } else {

            // Add to favorites
            favorites.push(title);

            favoriteButton.textContent = "♥";
            favoriteButton.classList.add("active");
        }

        // Save to localStorage
        localStorage.setItem("favorites", JSON.stringify(favorites));

    });

});


// -----------------------------
// CATEGORY FILTER
// -----------------------------

categoryButtons.forEach((button) => {

    button.addEventListener("click", () => {

        const selectedCategory = button.dataset.category;

        // Active button
        categoryButtons.forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");


        artCards.forEach((card) => {

            const category = card.dataset.category;
            const title = card.querySelector("h2").textContent;

            if (selectedCategory === "all") {

                card.style.display = "block";

            } else if (selectedCategory === "favorites") {

                if (favorites.includes(title)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }

            } else {

                if (category === selectedCategory) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }

            }

        });

    });

});

    </script>
